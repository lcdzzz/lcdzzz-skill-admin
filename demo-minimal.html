<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skill Manager · 极简亮色方案</title>
    <style>
      :root {
        --ink: #172334;
        --muted: #708096;
        --line: #e7ebf1;
        --blue: #2563eb;
        --bg: #f6f8fb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--bg);
        font:
          14px/1.55 Inter,
          ui-sans-serif,
          system-ui,
          sans-serif;
      }
      .shell {
        max-width: 1180px;
        margin: auto;
        padding: 32px 28px 70px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 52px;
      }
      .brand {
        font-weight: 800;
        letter-spacing: -0.04em;
        font-size: 20px;
      }
      .brand i {
        display: inline-grid;
        place-items: center;
        width: 26px;
        height: 26px;
        margin-right: 9px;
        border-radius: 8px;
        color: white;
        background: var(--blue);
        font-style: normal;
      }
      .user {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        color: #1742a0;
        background: #dbeafe;
        font-size: 12px;
        font-weight: 700;
      }
      .eyebrow {
        margin: 0 0 10px;
        color: var(--blue);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        max-width: 720px;
        margin: 0;
        font-size: clamp(34px, 5vw, 58px);
        line-height: 1.08;
        letter-spacing: -0.065em;
      }
      .lead {
        max-width: 550px;
        margin: 20px 0 32px;
        color: var(--muted);
        font-size: 16px;
      }
      .button {
        border: 0;
        border-radius: 10px;
        padding: 11px 16px;
        background: var(--blue);
        color: white;
        font: inherit;
        font-weight: 700;
        box-shadow: 0 10px 22px #2563eb26;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        margin: 60px 0 34px;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }
      .stat {
        padding: 19px 0;
        border-right: 1px solid var(--line);
      }
      .stat:last-child {
        border: 0;
        padding-left: 28px;
      }
      .stat:not(:last-child) {
        padding-right: 28px;
      }
      .stat strong {
        display: block;
        font-size: 25px;
        letter-spacing: -0.05em;
      }
      .stat span {
        color: var(--muted);
        font-size: 12px;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 0 23px;
        border-bottom: 1px solid var(--line);
      }
      input {
        flex: 1;
        min-width: 0;
        padding: 11px 0;
        border: 0;
        outline: 0;
        background: transparent;
        font: inherit;
      }
      input:focus {
        box-shadow: 0 2px var(--blue);
      }
      .filter {
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 9px 12px;
        background: white;
        color: var(--muted);
      }
      .heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 32px 0 14px;
      }
      .heading h2 {
        margin: 0;
        font-size: 15px;
      }
      .heading span {
        color: var(--muted);
        font-size: 12px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
      }
      .card {
        min-height: 185px;
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: white;
        transition: 0.18s;
      }
      .card:hover {
        border-color: #a9c5ff;
        box-shadow: 0 14px 28px #152f5610;
        transform: translateY(-2px);
      }
      .icon {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: #eff6ff;
        color: var(--blue);
        font-weight: 800;
      }
      .card h3 {
        margin: 18px 0 6px;
        font-size: 16px;
      }
      .card p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        margin-top: 28px;
        color: var(--muted);
        font-size: 11px;
      }
      .ok {
        color: #059669;
        font-weight: 700;
      }
      @media (max-width: 720px) {
        .shell {
          padding: 22px 16px;
        }
        .top {
          margin-bottom: 36px;
        }
        .stats,
        .grid {
          grid-template-columns: 1fr;
        }
        .stat,
        .stat:last-child {
          padding: 14px 0;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .bar {
          flex-wrap: wrap;
        }
        .bar input {
          flex-basis: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="top">
        <div class="brand"><i>S</i>Skill Manager</div>
        <div class="user">
          <div class="avatar">LQ</div>
          本地工作台
        </div>
      </header>
      <p class="eyebrow">Workspace / 2026</p>
      <h1>让管理，回到<br />清晰本身。</h1>
      <p class="lead">
        一个安静、有秩序的 Skill 工作台。去掉装饰噪音，让每一次维护都更专注。
      </p>
      <button class="button" type="button">＋ 新建 Skill</button>
      <section class="stats">
        <div class="stat"><strong>24</strong><span>已登记 Skill</span></div>
        <div class="stat"><strong>3</strong><span>已连接目录</span></div>
        <div class="stat">
          <strong>99.8%</strong><span>最近同步成功率</span>
        </div>
      </section>
      <section class="bar">
        <input
          aria-label="搜索 Skill"
          placeholder="搜索 Skill、描述或目录"
        /><span class="filter">最近更新⌄</span
        ><button class="button" type="button">搜索</button>
      </section>
      <div class="heading">
        <h2>全部 Skill</h2>
        <span>24 个结果</span>
      </div>
      <section class="grid">
        <article class="card">
          <div class="icon">01</div>
          <h3>基础能力</h3>
          <p>通用工作流、排错与协作规范。</p>
          <div class="foot">
            <span>~/.codex/skills</span><span class="ok">已同步</span>
          </div>
        </article>
        <article class="card">
          <div class="icon">02</div>
          <h3>API 文档生成</h3>
          <p>根据后端代码生成规范化接口文档。</p>
          <div class="foot">
            <span>团队目录</span><span class="ok">已同步</span>
          </div>
        </article>
        <article class="card">
          <div class="icon">03</div>
          <h3>MySQL 只读查询</h3>
          <p>以证据为核心的数据排查流程。</p>
          <div class="foot">
            <span>个人目录</span><span class="ok">已同步</span>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
