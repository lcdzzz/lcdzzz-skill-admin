name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            artifact: macos-arm64
            archive: dmg
          - runner: macos-15-intel
            artifact: macos-x64
            archive: dmg
          - runner: windows-latest
            artifact: windows-x64
            archive: zip

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Prepare clean runtime dependencies
        shell: bash
        run: |
          mkdir -p release-runtime
          cp package.json pnpm-lock.yaml release-runtime/
          pnpm --dir release-runtime install --prod --frozen-lockfile --ignore-workspace --ignore-scripts --config.node-linker=hoisted
          cp -R build dist LICENSE README.md release-runtime/
      - run: node scripts/assemble-release.mjs release

      - name: Create macOS app and DMG
        if: matrix.archive == 'dmg'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir release-macos
          ./scripts/package-macos.sh release release-macos
      - name: Upload macOS DMG
        if: matrix.archive == 'dmg'
        uses: actions/upload-artifact@v4
        with:
          name: skill-manager-${{ matrix.artifact }}
          path: release-macos/*.dmg
          if-no-files-found: error
      - name: Create zip
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path release\* -DestinationPath "skill-manager-${{ github.ref_name }}-${{ matrix.artifact }}.zip"
      - name: Smoke test Windows portable zip without system Node
        if: matrix.archive == 'zip'
        shell: pwsh
        run: ./scripts/smoke-windows-portable.ps1 "skill-manager-${{ github.ref_name }}-${{ matrix.artifact }}.zip"
      - name: Build Windows desktop EXE
        if: matrix.archive == 'zip'
        run: pnpm package:windows
      - name: Smoke test Windows desktop EXE
        if: matrix.archive == 'zip'
        shell: pwsh
        run: ./scripts/smoke-windows-desktop.ps1 "release-desktop/skill-manager-${{ github.ref_name }}-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        if: matrix.archive == 'zip'
        with:
          name: skill-manager-windows-desktop
          path: release-desktop/*.exe
          if-no-files-found: error
      - name: Upload Windows ZIP
        if: matrix.archive == 'zip'
        uses: actions/upload-artifact@v4
        with:
          name: skill-manager-${{ matrix.artifact }}
          path: skill-manager-${{ github.ref_name }}-${{ matrix.artifact }}.zip
          if-no-files-found: error

  publish:
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
