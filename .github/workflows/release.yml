name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            artifact: macos-arm64
            archive: tar.gz
          - runner: macos-13
            artifact: macos-x64
            archive: tar.gz
          - runner: windows-latest
            artifact: windows-x64
            archive: zip

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm deploy --prod --legacy --filter . release-runtime
      - name: Install locked production dependencies
        shell: bash
        run: |
          cp pnpm-lock.yaml release-runtime/pnpm-lock.yaml
          cd release-runtime
          pnpm install --prod --frozen-lockfile --ignore-workspace
      - run: node scripts/assemble-release.mjs release

      - name: Create tarball
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: tar -czf "skill-manager-${{ github.ref_name }}-${{ matrix.artifact }}.tar.gz" -C release .
      - name: Create zip
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path release\* -DestinationPath "skill-manager-${{ github.ref_name }}-${{ matrix.artifact }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: skill-manager-${{ matrix.artifact }}
          path: skill-manager-${{ github.ref_name }}-${{ matrix.artifact }}.${{ matrix.archive }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
